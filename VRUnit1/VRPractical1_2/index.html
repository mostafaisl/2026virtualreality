
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      
      <a-entity class="house" position="-8 0 0">

        
        <a-box position="0 1.5 0"
          width="6" height="3" depth="6"
          color="tan"></a-box>

        
        <a-box position="0 1 3.05"
          width="1.2" height="2" depth="0.1"
          color="brown"></a-box>

        
        <a-box position="-2 2 3.1"
          width="1.2" height="1" depth="0.1"
          color="blue"></a-box>

        <a-box position="2 2 3.1"
          width="1.2" height="1" depth="0.1"
          color="blue"></a-box>

       
        <a-box position="0 3.3 0"
          width="7" height="0.5" depth="7"
          rotation="0 0 0"
          color="red"></a-box>

      </a-entity>


      
      <a-entity class="house" position="0 0 0">

        <a-box position="0 1.5 0"
          width="6" height="3" depth="6"
          color="lightblue"></a-box>

        <a-box position="0 1 3.05"
          width="1.2" height="2" depth="0.1"
          color="brown"></a-box>

        <a-box position="-2 2 3.1"
          width="1.2" height="1" depth="0.1"
          color="blue"></a-box>

        <a-box position="2 2 3.1"
          width="1.2" height="1" depth="0.1"
          color="blue"></a-box>

        <a-box position="0 3.3 0"
          width="7" height="0.5" depth="7"
          color="darkblue"></a-box>

      </a-entity>


      
      <a-entity class="house" position="8 0 0">

        <a-box position="0 1.5 0"
          width="6" height="3" depth="6"
          color="pink"></a-box>

        <a-box position="0 1 3.05"
          width="1.2" height="2" depth="0.1"
          color="brown"></a-box>

        <a-box position="-2 2 3.1"
          width="1.2" height="1" depth="0.1"
          color="blue"></a-box>

        <a-box position="2 2 3.1"
          width="1.2" height="1" depth="0.1"
          color="blue"></a-box>

        <a-box position="0 3.3 0"
          width="7" height="0.5" depth="7"
          color="purple"></a-box>

      </a-entity>


      
      <a-plane position="0 0 -3"
        rotation="-90 0 0"
        width="40" height="40"
        color="#7BC8A4"></a-plane>

      
      <a-sky color="#87CEEB"></a-sky>

    </a-scene>
  </body>
</html>
